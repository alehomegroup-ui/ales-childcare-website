<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Thank You | Ale's Home Childcare</title>
<meta name="robots" content="noindex, follow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Mulish:wght@500;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --cream:#FFF8EC;
    --paper:#FFFCF6;
    --ink:#2B2640;
    --ink-soft:#665E80;
    --coral:#FF6F59;
    --coral-deep:#ED5B45;
    --grape:#8857C9;
    --white:#FFFFFF;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    min-height:100vh;
    display:grid;
    place-items:center;
    padding:24px;
    font-family:'Mulish',sans-serif;
    color:var(--ink);
    background:
      radial-gradient(circle at 20% 10%, rgba(255,111,89,.24), transparent 32%),
      radial-gradient(circle at 90% 80%, rgba(136,87,201,.22), transparent 34%),
      var(--cream);
  }
  main{
    width:min(620px,100%);
    background:var(--paper);
    border:6px solid var(--white);
    border-radius:28px;
    padding:34px 28px;
    text-align:center;
    box-shadow:0 18px 44px rgba(43,38,64,.14);
  }
  .badge{
    width:62px;
    height:62px;
    margin:0 auto 16px;
    border-radius:18px;
    display:grid;
    place-items:center;
    background:var(--coral);
    color:var(--white);
    font-size:30px;
  }
  h1{
    margin:0 0 10px;
    font-family:'Baloo 2',sans-serif;
    font-size:clamp(32px,8vw,44px);
    line-height:1.05;
  }
  p{
    margin:0 auto 22px;
    max-width:470px;
    color:var(--ink-soft);
    line-height:1.55;
    font-size:16px;
  }
  .actions{
    display:flex;
    justify-content:center;
    gap:12px;
    flex-wrap:wrap;
  }
  a{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    min-height:46px;
    padding:12px 20px;
    border-radius:999px;
    font-family:'Baloo 2',sans-serif;
    font-weight:800;
    text-decoration:none;
  }
  .primary{background:var(--coral); color:var(--white); box-shadow:0 7px 0 var(--coral-deep);}
  .secondary{background:var(--white); color:var(--grape); border:2px solid rgba(43,38,64,.14);}
</style>
<!-- Google tag (gtag.js) -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-2Q5XJXS903"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());

  gtag('config', 'G-2Q5XJXS903');
</script>
</head>
<body>
<main>
  <div class="badge">✓</div>
  <h1>Thank you</h1>
  <p>Your message was sent to Ale. She will reach out as soon as she can. For a faster reply, call or text directly.</p>
  <div class="actions">
    <a class="primary" href="tel:+12066091653">Call or Text Ale</a>
    <a class="secondary" href="/">Back to Website</a>
  </div>
</main>
</body>
</html>
